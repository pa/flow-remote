name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Node runs web/js under test: the WebCrypto interop tests in Go, and
      # the app's own tests.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: node --test web/js/*.test.mjs
      # flow-remote only runs on macOS today; keep it building for Linux.
      - run: GOOS=linux go build -o /dev/null ./cmd/flow-remote
      - name: shellcheck install.sh
        run: shellcheck install.sh

  macos:
    # flow-remote uses the Keychain and launchd, so build and test it on
    # macOS: the relay, and serve end to end over a unix socket.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o flow-remote ./cmd/flow-remote && ./flow-remote version
      - run: go test ./internal/keystore ./internal/identity ./internal/relay ./internal/serve ./internal/tunnel ./internal/webapp ./cmd/flow-remote

